<p-toast position="top-right" [life]="3000" />

<p-confirmDialog />

<div class="page-container">
  <header class="page-header">
    <div>
      <h1>Outros Créditos/Débitos</h1>

      <p-breadcrumb [model]="breadcrumbItems" [home]="home" />
    </div>
  </header>

  <main class="page-content">
    <app-lote-filtros (pesquisar)="onPesquisar($event)" />

    @if (erro()) {
      <div class="error-container" role="alert">
        <i class="pi pi-exclamation-circle"></i>

        <span>
          {{ erro() }}
        </span>
      </div>
    }

    @if (!erro() && pesquisou()) {
      <div class="result-summary">
        <span>
          {{ lotes().length }}
          lote(s) encontrado(s).
        </span>

        @if (lotesSelecionados().length > 0) {
          <span class="selection-summary">
            {{ lotesSelecionados().length }}
            selecionado(s).
          </span>
        }
      </div>

      <!-- BARRA DE AÇÕES -->
      <div class="action-bar" aria-label="Ações dos lotes">
        <div class="action-group">
          <p-button
            label="Confirmar"
            icon="pi pi-check"
            severity="success"
            [disabled]="!possuiSelecionados() || loading()"
            (onClick)="onConfirmar()"
          />

          <p-button
            label="Enviar"
            icon="pi pi-send"
            severity="info"
            [disabled]="!possuiSelecionados() || loading()"
            (onClick)="onEnviar()"
          />

          <p-button
            label="Visualizar Justificativa"
            icon="pi pi-comment"
            severity="secondary"
            [outlined]="true"
            [disabled]="!possuiSelecionados() || loading()"
            (onClick)="onVisualizarJustificativa()"
          />
        </div>

        <div class="action-group">
          <p-button
            label="Incluir"
            icon="pi pi-plus"
            [disabled]="loading()"
            (onClick)="onIncluir()"
          />

          <p-button
            label="Alterar"
            icon="pi pi-pencil"
            severity="secondary"
            [outlined]="true"
            [disabled]="!possuiUmSelecionado() || loading()"
            (onClick)="onAlterar()"
          />

          <p-button
            label="Excluir"
            icon="pi pi-trash"
            severity="danger"
            [outlined]="true"
            [disabled]="!possuiUmSelecionado() || loading()"
            (onClick)="onExcluir()"
          />

          <p-button
            label="Visualizar"
            icon="pi pi-eye"
            severity="secondary"
            [outlined]="true"
            [disabled]="!possuiUmSelecionado() || loading()"
            (onClick)="onVisualizar()"
          />
        </div>
      </div>

      <!-- TABELA -->
      <app-lote-table
        [lotes]="lotes()"
        [selecionados]="lotesSelecionados()"
        [loading]="loading()"
        (selecaoAlterada)="onSelecaoAlterada($event)"
      />
    }
  </main>

  <!-- MODAL DE LANÇAMENTO -->
  <app-lancamento-dialog
    [visible]="modalLancamentoVisivel()"
    (visibleChange)="modalLancamentoVisivel.set($event)"
  />

  <!-- MODAL VISUALIZAR / ALTERAR LOTE -->
  <app-lote-dialog
    [visible]="loteDialogVisivel()"
    [lote]="loteDialogSelecionado()"
    [modo]="loteDialogModo()"
    (visibleChange)="loteDialogVisivel.set($event)"
    (salvar)="onSalvarLoteAlterado($event)"
  />
</div>
